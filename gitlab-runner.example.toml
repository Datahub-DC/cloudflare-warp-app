# ==============================================================================
# GitLab Runner Configuration with Cloudflare WARP SOCKS5 Proxy
# File vị trí trên server: /etc/gitlab-runner/config.toml
# ==============================================================================

concurrent = 4
check_interval = 0
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

# ------------------------------------------------------------------------------
# CÁCH 1: DOCKER EXECUTOR (Phổ biến nhất)
# Lưu ý quan trọng: Bắt buộc dùng `network_mode = "host"` để container job
# có thể kết nối tới SOCKS5 Proxy tại 127.0.0.1:40000 của máy chủ Host!
# ------------------------------------------------------------------------------
[[runners]]
  name = "warp-docker-runner"
  url = "https://gitlab.com"
  id = 1
  token = "YOUR_RUNNER_TOKEN"
  token_obtained_at = 2026-09-29T00:00:00Z
  token_expires_at = 0001-01-01T00:00:00Z
  executor = "docker"

  # Biến môi trường tự động tiêm vào mỗi job container
  environment = [
    "http_proxy=socks5://127.0.0.1:40000",
    "https_proxy=socks5://127.0.0.1:40000",
    "all_proxy=socks5://127.0.0.1:40000",
    "HTTP_PROXY=socks5://127.0.0.1:40000",
    "HTTPS_PROXY=socks5://127.0.0.1:40000",
    "ALL_PROXY=socks5://127.0.0.1:40000",
    "no_proxy=localhost,127.0.0.1,docker.io,*.docker.io,*.docker.com,103.186.100.0/23",
    "NO_PROXY=localhost,127.0.0.1,docker.io,*.docker.io,*.docker.com,103.186.100.0/23"
  ]

  [runners.custom_build_dir]
  [runners.cache]
    MaxUploadedArchiveSize = 0
  [runners.docker]
    tls_verify = false
    image = "alpine:latest"
    privileged = false
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 0
    # Kích hoạt chia sẻ card mạng với máy chủ host để truy cập 127.0.0.1:40000
    network_mode = "host"

# ------------------------------------------------------------------------------
# CÁCH 2: SHELL EXECUTOR (Chạy trực tiếp trên máy chủ)
# Các job chạy thẳng trên môi trường máy chủ Host nên tự động ăn Proxy 127.0.0.1:40000
# ------------------------------------------------------------------------------
[[runners]]
  name = "warp-shell-runner"
  url = "https://gitlab.com"
  id = 2
  token = "YOUR_SHELL_RUNNER_TOKEN"
  executor = "shell"
  environment = [
    "http_proxy=socks5://127.0.0.1:40000",
    "https_proxy=socks5://127.0.0.1:40000",
    "all_proxy=socks5://127.0.0.1:40000",
    "no_proxy=localhost,127.0.0.1,docker.io,*.docker.io,*.docker.com,103.186.100.0/23"
  ]
